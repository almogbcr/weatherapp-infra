alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 24h
    additionalScrapeConfigs:
      - job_name: weatherapp-backend-prod
        metrics_path: /metrics
        scarpe_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kuberenets_pod_ip]
            target_label: __address__
            replacement: '$1:8000'
grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

