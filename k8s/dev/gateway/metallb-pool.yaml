apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: weatherapp-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.10.200-192.168.10.200
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: weatherapp-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - weatherapp-pool