{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weatherapp-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: weatherapp-tls
  dnsNames:
    - {{ .Values.gateway.hostname | quote }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
{{- end }}