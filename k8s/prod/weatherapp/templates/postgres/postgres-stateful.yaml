apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
       app: postgres
       type: db
       name: 'openweather-db'

    spec:
      containers:
        - name: postgres
          image: postgres:{{  .Values.postgres.postgresVer  }}
          ports:
          - containerPort: 5432

          resources:
            requests:
              cpu:  {{ .Values.postgres.resources.requests.reqCpu   }}
              memory:  {{ .Values.postgres.resources.requests.reqMem   }}

            limits:
              cpu:  {{ .Values.postgres.resources.limits.limitCpu   }}
              memory:  {{ .Values.postgres.resources.limits.limitMem   }}

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
               command:
                 - sh
                 - -c
                 - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage

      spec:
        storageClassName: {{  .Values.postgres.storage.storageClassName }}

        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.postgres.storage.size  }}
