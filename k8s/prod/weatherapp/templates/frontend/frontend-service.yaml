apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.frontend.frontendName }}
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: {{ .Values.frontend.frontendName }}   

  ports:
    - port: {{ .Values.frontend.ports.containerPort }}
      targetPort: {{ .Values.frontend.ports.containerPort }}
  type: {{ .Values.service.type_cluster }}