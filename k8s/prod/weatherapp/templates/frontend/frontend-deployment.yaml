apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.imgRep }}:{{ .Values.frontend.image.imgTag }}
          imagePullPolicy: {{ .Values.frontend.image.imgPullPol }}
          ports:
            - containerPort: {{ .Values.frontend.ports.containerPort }}
          resources:
            requests:
              cpu: {{ .Values.frontend.resources.requests.reqCpu }}
              memory: {{ .Values.frontend.resources.requests.reqMem }}
            limits:
              cpu: {{ .Values.frontend.resources.limits.limitCpu }}
              memory: {{ .Values.frontend.resources.limits.limitMem }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
