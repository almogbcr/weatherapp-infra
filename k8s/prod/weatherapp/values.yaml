backend:
  replicas: 1
  backendName: backend
  
  image:
    imgRep: almogbcr/weatherapp-backend
    imgTag: "caf17b1"
    imgPullPol: IfNotPresent

  ports:
    containerPort: 8000

  resources:
    requests:  
      reqCpu: "100m"
      reqMem: "128Mi"
    limits:
      limitCpu: "500m"
      limitMem: "256Mi"

  
  daily_request_limit: 999

service:
  type_cluster: ClusterIP

frontend:
  replicas: 1
  
  image:
    imgRep: almogbcr/weatherapp-frontend
    imgTag: "0f01147"
    imgPullPol: IfNotPresent
  
  ports:
    containerPort: 80

  resources:
    requests:
      reqCpu: "50m"
      reqMem: "64Mi"
    limits:
      limitCpu: "200m"
      limitMem: "128Mi"

postgres:

  postgresVer: 16

  resources:
    requests:
      reqCpu: "100m"
      reqMem: "256Mi"
    limits:
      limitCpu: "500m"
      limitMem: "512Mi"
  storage: 
    size: 5Gi
    storageClassName: local-path
